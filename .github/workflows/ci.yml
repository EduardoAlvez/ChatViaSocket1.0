name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: mvn -B package

      - name: Enviar jar
        uses: actions/upload-artifact@v7
        with:
          name: chat-via-socket
          path: target/chat-via-socket-*.jar
          if-no-files-found: error
